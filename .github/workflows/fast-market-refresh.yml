name: Fast Market Refresh V230

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * 1-5"

permissions:
  contents: write

concurrency:
  group: korea-fast-market-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only required dependency
        run: python -m pip install requests
      - name: Refresh canonical fast market fields
        run: python scripts/fast_market_refresh.py
      - name: Commit only when values changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/korea_rate_fx_outlook_v3.json output/fast_market_refresh_status.json
          if git diff --cached --quiet; then
            echo "No newer market observation; skip push."
          else
            git commit -m "chore: fast refresh Korea market snapshot"
            git push
          fi
