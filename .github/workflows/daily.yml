name: Korea Rate FX Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: korea-rate-fx-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate engine
        run: pytest -q

      - name: Run collectors
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          US_REPO_READ_TOKEN: ${{ secrets.US_REPO_READ_TOKEN }}
          US_POLICY_JSON_URL: ${{ secrets.US_POLICY_JSON_URL }}
          MODEL_TIMEZONE: Asia/Seoul
          PYTHONUNBUFFERED: "1"
        run: python -u -m src.main

      - name: Build Korea comprehensive market output
        run: python -u scripts/run_korea_comprehensive_market.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ cache/

          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: update Korea rate/FX outputs"
            git push
          fi
